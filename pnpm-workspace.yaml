packages:
  - .

# The overrides that existed only to patch @modelcontextprotocol/sdk's transitive tree
# (fast-uri, ip-address, qs, tar, @hono/node-server) were dropped together with the SDK
# itself — see D-034. Of what remains, `hono` floors our own direct dependency; the rest
# patch transitive dev-dependency trees (vite / vitest / testcontainers).
overrides:
  protobufjs: ">=7.5.5"
  minimatch: ">=9.0.7"
  picomatch: ">=4.0.4"
  brace-expansion: ">=2.0.3"
  uuid: ">=14.0.0"
  postcss: ">=8.5.10"
  hono: ">=4.13.0"

onlyBuiltDependencies:
  - '@biomejs/biome'
  - cpu-features
  - esbuild
  - protobufjs
  - ssh2

allowBuilds:
  '@biomejs/biome': true
  cpu-features: true
  esbuild: true
  protobufjs: true
  ssh2: true
