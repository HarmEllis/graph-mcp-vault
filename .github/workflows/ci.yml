name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint, typecheck, test, build ─────────────────────────────────────────────
  CI:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d  # v3.0.0
        with:
          version: latest

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit (Trivy lockfile scan)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: pnpm-lock.yaml
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "1"

      - name: Lint & format check
        run: pnpm biome check .

      - name: Typecheck
        run: pnpm tsc --noEmit

      - name: Run tests
        run: pnpm test
        env:
          # testcontainers pulls images from Docker Hub; no extra config needed on
          # ubuntu-24.04 runners which ship with Docker pre-installed.
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Build
        run: pnpm build

  # ── Lint workflow files ───────────────────────────────────────────────────────
  actionlint:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install actionlint
        run: |
          VERSION=1.7.7
          curl -sSfL \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz" \
            | tar xz actionlint
          sudo mv actionlint /usr/local/bin/

      - name: Run actionlint
        run: actionlint

  # ── Validate pinned action SHAs ───────────────────────────────────────────────
  validate-pins:
    name: Validate pinned action SHAs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Verify all pinned SHAs resolve
        run: bash scripts/ci/validate-pins.sh
        env:
          GH_TOKEN: ${{ github.token }}

  # ── Node 24 policy check ─────────────────────────────────────────────────────
  node-policy:
    name: Node 24 policy check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d  # v3.0.0
        with:
          version: latest

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Node 24 policy
        run: pnpm tsx scripts/ci/check-node-policy.ts

  # ── Docker build smoke-test ───────────────────────────────────────────────────
  docker-build:
    name: Docker build check
    needs: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Build Docker image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=docker-ci
          cache-to: type=gha,mode=max,scope=docker-ci
